// Read-only verification of an individual Mojang-named symbol against the pinned Forge 1.20.1 source runtime.
def defaultForge1201SourceClasspath = new File(rootProject.projectDir,
        'tools/forge1201-source-runtime/build/reports/source-runtime/forge1201-classpath.txt')
def forge1201SourceClasspath = file(project.findProperty('forge1201SourceClasspath')
        ?: defaultForge1201SourceClasspath.absolutePath)
def defaultForge1201SourceManifest = new File(rootProject.projectDir,
        'tools/forge1201-source-runtime/build/reports/source-runtime/forge1201-classpath-manifest.json')
def forge1201SourceManifest = file(project.findProperty('forge1201SourceManifest')
        ?: defaultForge1201SourceManifest.absolutePath)
def forge1201SourceMemberReport = layout.buildDirectory.file(
        'reports/source-runtime/forge1201-source-member-check.json')
def auditForge1201SourceRuntimeMember1201 = tasks.register(
        'auditForge1201SourceRuntimeMember1201', JavaExec) {
    group = 'verification'
    description = 'Checks one Forge 1.20.1 source member through either vanilla SRG mapping or a direct Mojang-official identity.'
    def memberMode = project.findProperty('forge1201SourceMemberMode')?.toString() ?: 'srg-official'
    def memberKind = project.findProperty('forge1201SourceMemberKind')?.toString()
    def memberOwner = project.findProperty('forge1201SourceMemberOwner')?.toString()
    def memberName = project.findProperty('forge1201SourceMemberName')?.toString()
    def memberDescriptor = project.findProperty('forge1201SourceMemberDescriptor')?.toString()

    dependsOn tasks.named('classes')
    if (memberMode == 'srg-official') {
        dependsOn verifySrgMojangInputs1201, extractFabricIntermediary1201
        inputs.file(joinedTsrg1201)
        inputs.file(fabricIntermediary1201Tiny)
        inputs.file(mojang1201)
    }
    inputs.file(forge1201SourceClasspath)
    inputs.file(forge1201SourceManifest)
    inputs.property('sourceMemberMode', memberMode)
    inputs.property('sourceMemberKind', memberKind ?: '<unset>')
    inputs.property('sourceMemberOwner', memberOwner ?: '<unset>')
    inputs.property('sourceMemberName', memberName ?: '<unset>')
    inputs.property('sourceMemberDescriptor', memberDescriptor ?: '<unset>')
    outputs.file(forge1201SourceMemberReport)
    classpath = sourceSets.main.output + configurations.runtimeClasspath
    mainClass = 'org.kylepitcock.legacyconnector.loader.tools.forge1201.Forge1201SourceRuntimeMemberVerifier'
    doFirst {
        if (!(memberMode in ['srg-official', 'direct-official'])) {
            throw new GradleException('Set -Pforge1201SourceMemberMode=srg-official or direct-official.')
        }
        if (!(memberKind in ['method', 'field'])) {
            throw new GradleException('Set -Pforge1201SourceMemberKind=method or field.')
        }
        if (!memberOwner || !memberName || !memberDescriptor) {
            throw new GradleException('Set -Pforge1201SourceMemberOwner, -Pforge1201SourceMemberName, and -Pforge1201SourceMemberDescriptor.')
        }
        if (!forge1201SourceClasspath.isFile() || !forge1201SourceManifest.isFile()) {
            throw new GradleException('Export the Forge 1.20.1 source runtime classpath and manifest first with exportForge1201SourceRuntimeClasspath.')
        }

        def sourceManifest = new groovy.json.JsonSlurper().parse(forge1201SourceManifest)
        if (sourceManifest.status != 'SOURCE_RUNTIME_CLASSPATH_EXPORTED'
                || sourceManifest.sourceRuntime?.minecraftVersion != '1.20.1'
                || sourceManifest.sourceRuntime?.forgeVersion != '47.3.0'
                || sourceManifest.sourceRuntime?.forgeGradleVersion != '6.0.24'
                || sourceManifest.sourceRuntime?.mappings?.channel != 'official'
                || sourceManifest.sourceRuntime?.mappings?.version != '1.20.1') {
            throw new GradleException('The source runtime manifest is not the pinned Forge 1.20.1 / 47.3.0 / ForgeGradle 6.0.24 / Mojang official profile.')
        }

        def listedSourceEntries = forge1201SourceClasspath.readLines('UTF-8')
                .findAll { !it.isBlank() }
                .collect { new File(it).absoluteFile.toPath().normalize().toString() }
        def manifestEntries = (sourceManifest.classpathEntries ?: []).collect {
            new File(it.path.toString()).absoluteFile.toPath().normalize().toString()
        }
        if (listedSourceEntries.isEmpty() || listedSourceEntries != manifestEntries) {
            throw new GradleException('Source runtime classpath list does not match the exact ordered entries recorded in its manifest.')
        }

        sourceManifest.classpathEntries.eachWithIndex { record, index ->
            def entry = new File(record.path.toString())
            if (!entry.exists()) {
                throw new GradleException('Source runtime classpath entry disappeared after export: ' + entry)
            }
            def actualSha256
            if (entry.isDirectory()) {
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                def files = fileTree(entry).files.sort { left, right ->
                    entry.toPath().relativize(left.toPath()).toString()
                            <=> entry.toPath().relativize(right.toPath()).toString()
                }
                files.each { child ->
                    def relative = entry.toPath().relativize(child.toPath()).toString()
                            .replace(File.separatorChar, '/' as char)
                    digest.update(relative.getBytes(java.nio.charset.StandardCharsets.UTF_8))
                    digest.update((byte) 0)
                    child.withInputStream { input ->
                        byte[] buffer = new byte[64 * 1024]
                        int count
                        while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
                    }
                    digest.update((byte) 0xff)
                }
                actualSha256 = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
            } else {
                actualSha256 = mappingFileSha(entry, 'SHA-256')
            }
            if (!record.sha256?.toString()?.equalsIgnoreCase(actualSha256)) {
                throw new GradleException('Source runtime classpath entry SHA-256 no longer matches its export manifest at index '
                        + index + ': ' + entry)
            }
        }

        if (sourceManifest.classpathFile == null
                || new File(sourceManifest.classpathFile.toString()).absoluteFile.toPath().normalize()
                        != forge1201SourceClasspath.absoluteFile.toPath().normalize()) {
            throw new GradleException('Source runtime manifest does not identify the supplied classpath list.')
        }

        def requiredSourceProbes = [
                'net/minecraft/world/level/block/piston/PistonStructureResolver.class',
                'net/minecraft/world/level/block/state/BlockState.class',
                'net/minecraft/world/level/block/Block.class'
        ]
        requiredSourceProbes.each { probe ->
            def result = sourceManifest.classProbes?.get(probe)
            if (result == null || result.matchCount != 1
                    || result.firstMatch?.classpathIndex != 0
                    || result.firstMatch?.path == null
                    || new File(result.firstMatch.path.toString()).absoluteFile.toPath().normalize()
                            != new File(manifestEntries[0]).absoluteFile.toPath().normalize()) {
                throw new GradleException('Source runtime manifest has no unique effective classpath[0] probe for ' + probe)
            }
        }

        if (memberMode == 'direct-official') {
            setArgs([
                    '--direct-official',
                    forge1201SourceClasspath.absolutePath,
                    memberKind,
                    memberOwner,
                    memberName,
                    memberDescriptor,
                    forge1201SourceMemberReport.get().asFile.absolutePath
            ])
        } else {
            setArgs([
                    forge1201SourceClasspath.absolutePath,
                    joinedTsrg1201.get().asFile.absolutePath,
                    fabricIntermediary1201Tiny.get().asFile.absolutePath,
                    mojang1201.get().asFile.absolutePath,
                    memberKind,
                    memberOwner,
                    memberName,
                    memberDescriptor,
                    forge1201SourceMemberReport.get().asFile.absolutePath
            ])
        }
    }
}

