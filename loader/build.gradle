plugins {
    id 'java-library'
}

// The loader runs on FML's SERVICE module layer, before Minecraft classes exist.
// It may only depend on FML / modlauncher / ASM / Gson / SLF4J, all of which NeoForge ships.
group = mod_group_id
version = mod_version
base.archivesName = 'legacyconnector-loader'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Loader helper processes and test workers must use the same Java 21 toolchain as the compiled classes,
// even when IntelliJ starts the Gradle daemon on Java 17.
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.withType(Test).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

configurations {
    forge1710
    forge164
    forge152
    forge147
    mcp1710
    mcp1122
    mcpconfig1201
    betaIntermediary
    betaBiny
}

dependencies {
    compileOnly("net.neoforged.fancymodloader:loader:4.0.45") { transitive = false }
    compileOnly("cpw.mods:securejarhandler:3.0.8") { transitive = false }
    compileOnly("cpw.mods:modlauncher:11.0.5") { transitive = false }
    compileOnly "org.slf4j:slf4j-api:2.0.9"
    compileOnly "com.google.code.gson:gson:2.10.1"
    compileOnly "org.jetbrains:annotations:24.1.0"
    api "org.ow2.asm:asm:${asm_version}"
    api "org.ow2.asm:asm-commons:${asm_version}"
    api "org.ow2.asm:asm-tree:${asm_version}"
    api "org.ow2.asm:asm-analysis:${asm_version}"

    // 1.7.10: the names Forge itself shipped (setBlockName, registerBlockIcons, ...) are what mod authors
    // actually wrote against; MCP stable_12 fills ids Forge's table lacks.
    forge1710 "net.minecraftforge:forge:${forge_1_7_10}:userdev@jar"
    // 1.6.4: the MCP names of Forge 9.11.1.1345 (fml/conf of the source zip); there is no separate MCP export
    forge164 "net.minecraftforge:forge:${forge_1_6_4}:src@zip"
    // 1.5.2: the MCP 7.51 names of Forge 7.8.1.738 (fml/conf of the source zip)
    forge152 "net.minecraftforge:forge:${forge_1_5_2}:src@zip"
    // 1.4.7: the MCP 6.x names of Forge 6.6.2.534 (fml/conf of the source zip)
    forge147 "net.minecraftforge:forge:${forge_1_4_7}:src@zip"
    mcp1710 "de.oceanlabs.mcp:mcp_stable:${mcp_1_7_10}@zip"
    mcp1122 "de.oceanlabs.mcp:mcp_stable:${mcp_1_12_2}@zip"
    // Forge 1.20.1 mods are SRG-named; the SRG -> Mojang table is chained from MCPConfig and Mojang's mappings at build time (never committed)
    mcpconfig1201 "de.oceanlabs.mcp:mcp_config:1.20.1-20230612.114412@zip"
    // Beta 1.7.3 mods use the obfuscated names: Babric intermediary (official client/server -> intermediary) chained with
    // biny (intermediary -> named), both CC0, into one table at build time (BetaMappings; never committed)
    betaIntermediary "babric:intermediary:${beta_intermediary}:v2@jar"
    betaBiny "net.glasslauncher:biny:${beta_biny}:v2@jar"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.ow2.asm:asm-util:${asm_version}"
    testImplementation "com.google.code.gson:gson:2.10.1"
    testImplementation "org.slf4j:slf4j-api:2.0.9"
    testRuntimeOnly "org.slf4j:slf4j-simple:2.0.9"
}

// The loader implementation is linked against FML's service-layer SPI via compileOnly.
// Tests that reference LegacyModLocator (including its inherited interfaces) need those
// same compile-time APIs available both to javac and to the test JVM.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

repositories {
    maven {
        url = 'https://maven.glass-launcher.net/babric'
        metadataSources { mavenPom(); artifact() }
        content { includeModule 'babric', 'intermediary' }
    }
    maven {
        url = 'https://maven.glass-launcher.net/releases'
        metadataSources { mavenPom(); artifact() }
        content { includeModule 'net.glasslauncher', 'biny' }
    }
    maven {
        url = 'https://maven.minecraftforge.net'
        metadataSources { mavenPom(); artifact() } // ancient Forge artifacts have no POM
        content {
            includeGroup 'de.oceanlabs.mcp'
            includeModule 'net.minecraftforge', 'forge'
        }
    }
}

// SRG -> MCP name tables. Legacy mod jars are reobfuscated to SRG names (func_1234_a / field_1234_a);
// the shim API is written with readable MCP names, so the transformer renames members on the fly.
def extractMappings = tasks.register('extractMappings', Sync) {
    into layout.buildDirectory.dir('generated/mappings')
    [('1.7.10'): configurations.mcp1710, ('1.12.2'): configurations.mcp1122].each { ver, conf ->
        from({ zipTree(conf.singleFile) }) {
            include 'methods.csv', 'fields.csv'
            into "legacyconnector/mappings/${ver}"
            // For 1.7.10 the MCP export is only the fallback table.
            if (ver == '1.7.10') rename { "fallback-${it}" }
        }
    }
    from({ zipTree(configurations.forge1710.singleFile) }) {
        include 'conf/methods.csv', 'conf/fields.csv'
        eachFile { it.path = "legacyconnector/mappings/1.7.10/${it.name}" }
        includeEmptyDirs = false
    }
    from({ zipTree(configurations.forge164.singleFile) }) {
        include 'forge/fml/conf/methods.csv', 'forge/fml/conf/fields.csv'
        eachFile { it.path = "legacyconnector/mappings/1.6.4/${it.name}" }
        includeEmptyDirs = false
    }
    from({ zipTree(configurations.forge152.singleFile) }) {
        include 'forge/fml/conf/methods.csv', 'forge/fml/conf/fields.csv'
        eachFile { it.path = "legacyconnector/mappings/1.5.2/${it.name}" }
        includeEmptyDirs = false
    }
    from({ zipTree(configurations.forge147.singleFile) }) {
        include 'forge/fml/conf/methods.csv', 'forge/fml/conf/fields.csv'
        eachFile { it.path = "legacyconnector/mappings/1.4.7/${it.name}" }
        includeEmptyDirs = false
    }
}
sourceSets.main.resources.srcDir extractMappings

// SRG -> Mojang table for 1.20.1 (SrgMojangTable): joined.tsrg from MCPConfig + Mojang's client.txt (downloaded once into build/mojang-mappings)
def mojang1201 = layout.buildDirectory.file('mojang-mappings/1.20.1-client.txt')
def fetchMojang1201 = tasks.register('fetchMojangMappings1201') {
    outputs.file(mojang1201)
    doLast {
        def out = mojang1201.get().asFile
        out.parentFile.mkdirs()
        new URL('https://piston-data.mojang.com/v1/objects/6c48521eed01fe2e8ecdadbd5ae348415f3c47da/client.txt').withInputStream { i -> out.withOutputStream { it << i } }
    }
}
def srgMojangDir = layout.buildDirectory.dir('generated/srg-mojang')
def genSrgMojang = tasks.register('genSrgMojang1201', JavaExec) {
    dependsOn fetchMojang1201, tasks.named('classes')
    inputs.files(configurations.mcpconfig1201)
    inputs.file(mojang1201)
    outputs.dir(srgMojangDir)
    classpath = sourceSets.main.output
    mainClass = 'org.kylepitcock.legacyconnector.loader.mapping.SrgMojangTable'
    argumentProviders.add({
        def tsrg = layout.buildDirectory.file('tmp/mcpconfig1201/joined.tsrg').get().asFile
        tsrg.parentFile.mkdirs()
        zipTree(configurations.mcpconfig1201.singleFile).matching { include 'config/joined.tsrg' }.singleFile.withInputStream { i -> tsrg.withOutputStream { it << i } }
        [tsrg.absolutePath, mojang1201.get().asFile.absolutePath, srgMojangDir.get().file('legacyconnector/mappings/1.20.1/srg-mojang.tsv').asFile.absolutePath]
    } as CommandLineArgumentProvider)
}
tasks.named('jar') { dependsOn genSrgMojang; from(srgMojangDir) }
// offline tools (checkLegacyMod, gap1201) run from the class directories: give them the generated table too
sourceSets.main.runtimeClasspath += files(srgMojangDir).builtBy(genSrgMojang)

// Beta 1.7.3 official -> named table (BetaMappings): Babric intermediary + biny
def betaMappingsDir = layout.buildDirectory.dir('generated/beta-mappings')
def genBetaMappings = tasks.register('genBetaMappings', JavaExec) {
    dependsOn tasks.named('classes')
    inputs.files(configurations.betaIntermediary, configurations.betaBiny)
    outputs.dir(betaMappingsDir)
    classpath = sourceSets.main.output
    mainClass = 'org.kylepitcock.legacyconnector.loader.mapping.BetaMappings'
    argumentProviders.add({
        def tmp = layout.buildDirectory.dir('tmp/beta-mappings').get().asFile
        tmp.mkdirs()
        def extract = { conf, name ->
            def f = new File(tmp, name)
            zipTree(conf.singleFile).matching { include 'mappings/mappings.tiny' }.singleFile.withInputStream { i -> f.withOutputStream { it << i } }
            f.absolutePath
        }
        [extract(configurations.betaIntermediary, 'intermediary.tiny'), extract(configurations.betaBiny, 'biny.tiny'),
         betaMappingsDir.get().file('legacyconnector/mappings/b1.7.3/official-named.tsv').asFile.absolutePath]
    } as CommandLineArgumentProvider)
}
tasks.named('jar') { dependsOn genBetaMappings; from(betaMappingsDir) }
sourceSets.main.runtimeClasspath += files(betaMappingsDir).builtBy(genBetaMappings)


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    useJUnitPlatform()
    dependsOn genBetaMappings
    classpath += files(betaMappingsDir)
}

jar {
    manifest {
        attributes(
                'Automatic-Module-Name': 'legacyconnector.loader',
                'Implementation-Version': project.version
        )
    }
}

// Content hash of the compiled translator, embedded as a resource. Part of every translation cache key, so changing
// the loader re-translates legacy jars without manual version bumps.
def buildIdDir = layout.buildDirectory.dir('generated/buildId')
def generateBuildId = tasks.register('generateBuildId') {
    def classesDir = sourceSets.main.java.classesDirectory
    def hierarchy = fileTree('src/main/resources/legacyconnector/legacy')
    def mappings = fileTree(layout.buildDirectory.dir('generated/mappings'))
    dependsOn 'extractMappings'
    inputs.files(classesDir, hierarchy, mappings)
    outputs.dir buildIdDir
    doLast {
        def md = java.security.MessageDigest.getInstance('SHA-256')
        (classesDir.get().asFileTree.files + hierarchy.files + mappings.files).sort { it.absolutePath }.each { md.update(it.bytes) }
        def out = buildIdDir.get().file('legacyconnector/loader-build-id.txt').asFile
        out.parentFile.mkdirs()
        out.text = md.digest().encodeHex().toString()
    }
}
sourceSets.main.resources.srcDir(files(buildIdDir).builtBy(generateBuildId))

// Legacy-named LaunchWrapper / FML relauncher API that 1.7.10 coremod plugins and class transformers link against.
// Packed as a nested jar: it is only ever loaded in the isolated class loader that runs legacy coremods.
sourceSets {
    coremodApi
    // the pieces of the API that differ in Forge 1.6.4 / 1.5.2 (java.util.logging FMLLog, IFMLLoadingPlugin.getLibraryRequestClass)
    coremodApi164 {
        compileClasspath += sourceSets.coremodApi.output
    }
}
dependencies {
    coremodApiCompileOnly "org.ow2.asm:asm-commons:${asm_version}"
    coremodApiCompileOnly "org.apache.logging.log4j:log4j-api:2.22.1"
    coremodApiCompileOnly "com.google.guava:guava:33.0.0-jre"
}
def coremodApiJar = tasks.register('coremodApiJar', Jar) {
    from sourceSets.coremodApi.output
    archiveFileName = 'coremod-api.jar'
    destinationDirectory = layout.buildDirectory.dir('generated/coremodApi/legacyconnector/legacy/1.7.10')
}
def coremodApi164Jar = tasks.register('coremodApi164Jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.coremodApi164.output // first: wins over the 1.7.10 classes of the same name
    from sourceSets.coremodApi.output
    archiveFileName = 'coremod-api.jar'
    destinationDirectory = layout.buildDirectory.dir('generated/coremodApi/legacyconnector/legacy/1.6.4')
}
sourceSets.main.resources.srcDir(files(layout.buildDirectory.dir('generated/coremodApi')).builtBy(coremodApiJar, coremodApi164Jar))
