plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.24'
}

group = 'com.example.legacyspawnprobe'
version = '1.0.0'

base {
    archivesName = 'legacyconnector-spawn-probe'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
}

repositories {
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'Legacy Connector Forge 1.20.1 Spawn Probe',
                'Specification-Vendor'    : 'kentvillamor08',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version' : project.version,
                'Implementation-Vendor'  : 'kentvillamor08'
        ])
    }
    finalizedBy 'reobfJar'
}
