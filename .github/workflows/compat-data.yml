name: Compatibility data

# Rebuilds docs/data/reports.json (shown on the compatibility site) from the issues labelled "compatibility".
on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: compat-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Newest data
        run: bash tools/compat/site_data.sh pull
      - name: Build reports.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/compat/build_reports.py "${{ github.repository }}"
      - name: Publish to the site-data branch
        run: bash tools/compat/site_data.sh push "Update compatibility reports"
