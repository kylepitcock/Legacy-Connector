name: AlienEvo adapter regression tests

on:
  push:
    branches:
      - fix/forge1201-palladium-runtime-adapters

permissions:
  contents: read

concurrency:
  group: alien-evo-adapter-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    name: Focused ASM tests and runtime compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run focused AlienEvo transformer tests
        run: |
          chmod +x ./gradlew
          ./gradlew :loader:test \
            --tests 'org.kylepitcock.legacyconnector.loader.transform.AlienEvoBufferingGlowConsumer1201Test' \
            --tests 'org.kylepitcock.legacyconnector.loader.transform.AlienEvoBoneAnchors1201Test' \
            --tests 'org.kylepitcock.legacyconnector.loader.transform.AlienEvoGeckoRenderLayerModel1201Test' \
            --tests 'org.kylepitcock.legacyconnector.loader.transform.AlienEvoSlimeDecalMesh1201Test' \
            --tests 'org.kylepitcock.legacyconnector.loader.transform.PalladiumResourceCompat1201Test' \
            --no-daemon --stacktrace

      - name: Compile runtime helper and mod sources
        run: ./gradlew :compileJava --no-daemon --stacktrace

      - name: Run runtime helper unit test
        run: |
          ./gradlew :test \
            --tests 'org.kylepitcock.legacyconnector.v1_20_1.migrate.AlienEvoBufferRefresh1201Test' \
            --tests 'org.kylepitcock.legacyconnector.v1_20_1.migrate.AlienEvoCameraRotation1201RuntimeTest' \
            --no-daemon --stacktrace

      - name: Run dimensions probe package regression test
        run: |
          ./gradlew :test \
            --tests 'org.kylepitcock.legacyconnector.diagnostics.alienevo.AlienEvoDimensionsProbePackageTest' \
            --no-daemon --stacktrace

      - name: Run clean multi-project build and testmod assembly
        run: |
          ./gradlew :clean :loader:clean :testmods:clean \
            :build :loader:build :testmods:assemble \
            --no-daemon --console=plain --stacktrace
