name: Compatibility probe

# Automated compatibility results (like Sinytra's checker): downloads the most downloaded Forge mods of each legacy
# Minecraft version from Modrinth, translates them offline with `checkLegacyMod` (no game), and commits the results to
# docs/data/mods.json (source "probe", lowest tier) and docs/data/probe.json (pie chart page docs/probe.html).
# The jars live only on the runner and are discarded; nothing but the results is committed.
on:
  release:
    types: [published]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "Mods per Minecraft version"
        default: "700"

permissions:
  contents: write

concurrency:
  group: compat-probe
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master   # a release event checks out the tag (detached HEAD): the probe runs on master
          fetch-depth: 0

      - name: Newest data
        run: bash tools/compat/site_data.sh pull

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Probe
        env:
          LIMIT: ${{ inputs.limit || '700' }}
        run: |
          chmod +x gradlew
          # Version recorded with the run. A release event keeps the release version; scheduled and manual runs probe master, which is usually
          # past the last release, so they use the same naming as the nightly jar (<latest release>-nightly.<run>.<short sha>, see nightly.yml)
          # to tell runs of different commits apart.
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"; VERSION="${VERSION#v}"
          else
            LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
            BASE="${LAST#v}"
            [ -z "$BASE" ] && BASE=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
            VERSION="${BASE}-nightly.${{ github.run_number }}.$(git rev-parse --short=7 HEAD)"
          fi
          echo "probe version: $VERSION"
          # a mod that got worse than in the previous run fails the job, but only after the results are committed (next step)
          REGRESSED=0
          # every supported legacy version; 1.20.1 is a gap report against the NeoForge artifacts of a build (content mods only, fewer jars)
          ./gradlew compileJava -q
          for MC in 1.7.10 1.12.2 1.6.4 1.5.2 1.4.7 b1.7.3 1.20.1; do
            if [ "$MC" = "1.20.1" ]; then
              python3 tools/compat/fetch_probe_mods.py "$MC" "$RUNNER_TEMP/jars-$MC" --limit 400 --content || true
            else
              python3 tools/compat/fetch_probe_mods.py "$MC" "$RUNNER_TEMP/jars-$MC" --limit "$LIMIT" || true
            fi
            if [ -z "$(ls "$RUNNER_TEMP/jars-$MC" 2>/dev/null)" ]; then echo "no jars for $MC"; continue; fi
            # Modrinth has almost no Beta mods: a handful of jars is not a representative sample and would only look like a collapse next to
            # the maintainer's larger runs of that version, so it is not recorded
            if [ "$MC" = "b1.7.3" ] && [ "$(ls "$RUNNER_TEMP/jars-$MC" | wc -l)" -lt 20 ]; then
              echo "skipping $MC: Modrinth yielded only $(ls "$RUNNER_TEMP/jars-$MC" | wc -l) jars (fewer than 20), not a representative sample"; continue
            fi
            python3 tools/compat/probe.py "$RUNNER_TEMP/jars-$MC" --mc "$MC" --version "$VERSION" --source modrinth --fail-on-regression || REGRESSED=1
          done
          echo "REGRESSED=$REGRESSED" >> "$GITHUB_ENV"

      - name: Publish to the site-data branch
        run: bash tools/compat/site_data.sh push "Update automated compatibility results"

      - name: Fail on regressions
        if: env.REGRESSED == '1'
        run: |
          echo "::error::Some mods got worse than in the previous probe run; see the REGRESSED lines in the Probe step and docs/data/probe.json"
          exit 1
