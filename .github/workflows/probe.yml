name: Compatibility probe

# Automated compatibility results (like Sinytra's checker): downloads the most downloaded Forge mods of each legacy
# Minecraft version from Modrinth, translates them offline with `checkLegacyMod` (no game), and commits the results to
# docs/data/mods.json (source "probe", lowest tier) and docs/data/probe.json (pie chart page docs/probe.html).
# The jars live only on the runner and are discarded; nothing but the results is committed.
on:
  release:
    types: [published]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "Mods per Minecraft version"
        default: "700"

permissions:
  contents: write

concurrency:
  group: compat-probe
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master   # a release event checks out the tag (detached HEAD): the results must be committed to master

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Probe
        env:
          LIMIT: ${{ inputs.limit || '700' }}
        run: |
          chmod +x gradlew
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          # a mod that got worse than in the previous run fails the job, but only after the results are committed (next step)
          REGRESSED=0
          # every supported legacy version; 1.20.1 is a gap report against the NeoForge artifacts of a build (content mods only, fewer jars)
          ./gradlew compileJava -q
          for MC in 1.7.10 1.12.2 1.6.4 1.5.2 1.4.7 b1.7.3 1.20.1; do
            if [ "$MC" = "1.20.1" ]; then
              python3 tools/compat/fetch_probe_mods.py "$MC" "$RUNNER_TEMP/jars-$MC" --limit 400 --content || true
            else
              python3 tools/compat/fetch_probe_mods.py "$MC" "$RUNNER_TEMP/jars-$MC" --limit "$LIMIT" || true
            fi
            if [ -z "$(ls "$RUNNER_TEMP/jars-$MC" 2>/dev/null)" ]; then echo "no jars for $MC"; continue; fi
            python3 tools/compat/probe.py "$RUNNER_TEMP/jars-$MC" --mc "$MC" --version "$VERSION" --source modrinth --fail-on-regression || REGRESSED=1
          done
          echo "REGRESSED=$REGRESSED" >> "$GITHUB_ENV"

      - name: Commit results
        run: |
          if git diff --quiet -- docs/data; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/mods.json docs/data/probe.json
          git commit -m "Update automated compatibility results"
          git pull --rebase
          git push

      - name: Fail on regressions
        if: env.REGRESSED == '1'
        run: |
          echo "::error::Some mods got worse than in the previous probe run; see the REGRESSED lines in the Probe step and docs/data/probe.json"
          exit 1
