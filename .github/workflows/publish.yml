name: Publish release

# Builds the distributable jar and uploads it to Modrinth and CurseForge
# whenever a GitHub release is published. The version comes from the tag (v0.0.7 -> 0.0.7).
# Needs the repository secrets MODRINTH_TOKEN and CURSEFORGE_TOKEN.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.0.7)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version from tag
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew bundleJar -Pmod_version=${{ steps.ver.outputs.version }}

      - name: Publish to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: CCxw8Nzy
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1763521
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: build/dist/legacyconnector-*.jar
          name: Legacy Connector ${{ steps.ver.outputs.version }}
          version: ${{ steps.ver.outputs.version }}
          version-type: alpha
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            jei(optional)
            jade(optional)
            curios(optional)
