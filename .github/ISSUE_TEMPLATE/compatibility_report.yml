name: Compatibility report
description: Report how a legacy mod behaves under Legacy Connector (works, partly works, fails to load, crashes).
title: "[Compat] <mod name> <mod version> (<legacy Minecraft version>)"
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! One report per mod (or per mod + its required libraries) keeps things easy to track.

        ## Reports without logs usually cannot be fixed
        Please attach these files from your Minecraft folder (drag and drop them into the boxes at the bottom of this form; if a file is too big, zip it first):
        - **`logs/latest.log`** — always, even if the game did not crash. It names missing textures, models and errors.
        - **`logs/legacyconnector-report.txt`** — the translation report.
        - the newest file in **`crash-reports/`** if the game crashed.

        Copy the logs **right after** the problem happened and **before** you restart the game: `latest.log` is overwritten on every launch.
        Do not paste the text of a log into the form; attach the file.

  - type: input
    id: mod
    attributes:
      label: Mod
      description: Name and exact version of the legacy mod, as in its file name.
      placeholder: "Thaumcraft 4.2.3.5"
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Download link
      description: CurseForge / Modrinth / GitHub page of that exact version (do not attach the jar itself).
      placeholder: "https://www.curseforge.com/minecraft/mc-mods/..."

  - type: dropdown
    id: legacy-version
    attributes:
      label: Legacy Minecraft version of the mod
      options:
        - "1.7.10"
        - "1.8 - 1.12.2"
        - "1.16.5"
        - "1.20.1 (Forge)"
        - "1.20.1 (Fabric, via Sinytra Connector)"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Result
      options:
        - "Works (no problems found)"
        - "Partially works (loads, some features missing or broken)"
        - "Fails to load (game starts, mod is disabled)"
        - "Crashes or hangs the game"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: What works and what doesn't
      description: Blocks/items/GUIs/world generation/machines you tried, and what happened. Screenshots welcome.
      placeholder: |
        - Items show up in the creative tab, but have no textures
        - Crafting the X works, the Y machine GUI does not open
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (for crashes or broken features)
      placeholder: |
        1. Create a new world
        2. Place the X block
        3. Right click it

  - type: input
    id: legacyconnector-version
    attributes:
      label: Legacy Connector version / commit
      placeholder: "0.1.0 or commit 87bace9"
    validations:
      required: true

  - type: input
    id: neoforge-version
    attributes:
      label: NeoForge version
      placeholder: "21.1.258"
    validations:
      required: true

  - type: dropdown
    id: side
    attributes:
      label: Where did you test?
      multiple: true
      options:
        - "Singleplayer / client"
        - "Dedicated server"

  - type: textarea
    id: other-mods
    attributes:
      label: Other mods installed
      description: Legacy mods (and modern ones like JEI, Jade, Curios) in the same instance. A short list is best — ideally only the mod and its dependencies.

  - type: textarea
    id: report
    attributes:
      label: legacyconnector-report.txt (attach the file)
      description: Drag `logs/legacyconnector-report.txt` into this box. Attach the file; do not paste its text.
      placeholder: Drag the file here (it appears as a link)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: latest.log (attach the file) and crash report
      description: Drag `logs/latest.log` into this box, from the run where the problem happened (it is overwritten on the next launch). If the game crashed, also drag the newest file from `crash-reports/`. If GitHub refuses the file, zip it. Do not paste the log text.
      placeholder: Drag logs/latest.log here (it appears as a link)
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this mod and version.
          required: true
        - label: I attached logs/latest.log from the run where the problem happened (not pasted as text).
          required: true
        - label: I tested with the newest Legacy Connector build.
        - label: I tested with only this mod (and its required libraries) installed.
