plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
base { archivesName = 'thaumcraft-modern-aspects' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
    mavenCentral()
}

neoForge {
    version = '21.1.258'
}

dependencies {
    // The addon API only. In this repository it is built by `./gradlew apiJar` in the repository root; a published addon would use
    // a maven coordinate instead (see docs/wiki/Addon-API.md). compileOnly: at runtime the API is inside the Legacy Connector jar.
    compileOnly files(project.findProperty('legacyApiJar') ?: '../../build/dist/legacyconnector-api-0.3.6.jar')
}

// The mods.toml is generated so the version stays in one place.
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) }
}
