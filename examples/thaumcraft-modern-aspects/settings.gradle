// Standalone build: NOT part of the Legacy Connector build (the root settings.gradle does not include it).
pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'thaumcraft-modern-aspects'
