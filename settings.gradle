pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'mccompat'

// Service-layer half of the compatibility layer: discovers legacy mod jars and
// rewrites them into NeoForge mods before FML ever sees them.
include 'loader'
// Pure-Java fixtures that imitate legacy (1.7.10 / 1.12.2) Forge mods for integration testing.
include 'testmods'
