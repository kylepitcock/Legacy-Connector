modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[mixins]]
config = "legacyconnector.mixins.json"

[[mixins]]
config = "legacyconnector.compat.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Optional: legacy biomes are placed as a TerraBlender overworld region when it is installed.
[[dependencies."${mod_id}"]]
modId = "terrablender"
type = "optional"
versionRange = "[4.0,)"
ordering = "NONE"
side = "BOTH"
