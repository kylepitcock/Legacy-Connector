modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[mixins]]
config = "legacyconnector.mixins.json"

[[mixins]]
config = "legacyconnector.compat.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Legacy biome placement uses the external TerraBlender mod; it is not embedded in Legacy Connector.
[[dependencies."${mod_id}"]]
modId = "terrablender"
type = "required"
versionRange = "[4.0,)"
ordering = "NONE"
side = "BOTH"

# Legacy Entity.setSize and eyeHeight calls use Pehkui when it is installed. Its API is isolated behind a runtime presence check.
[[dependencies."${mod_id}"]]
modId = "pehkui"
type = "optional"
versionRange = "[3.8.3,)"
ordering = "AFTER"
side = "BOTH"
